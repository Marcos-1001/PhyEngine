# Parámetros de PhyEngine (unidades de sim, no SI).
# Formato: clave = valor   ·   '#' = comentario   ·   claves ausentes → default.
# Se carga al arrancar:  ./PhyEngine [ruta_config]   (por defecto ./sim.conf)

# --- Solver SPH ---
restDensity      = 1.0      # ρ0; el retículo (d=8,h=16,mass=80) reposa ≈ 1.0
gasConstant      = 2000     # rigidez; estable 100–2000
viscosity        = 0.3      # amortiguación; súbela si tiembla la superficie
smoothingLength  = 12       # h; DEBE ser > spacing
surfaceTension   = 0      # 0 = sin tensión; tunea 1–100 al activarla
surfaceThreshold = 0.01     # |n| mínimo para tratar una partícula como superficie

# --- Escena (bloque inicial) ---
numParticles     = 20       # por lado → 30x30 = 900 partículas
spacing          = 8        # d (< h)
mass             = 80       # ρ0·d² ajustado para densidad de reposo ≈ ρ0
originX          = 350      # esquina inferior-izquierda del bloque
originY          = 350

# --- Integración ---
dt               = 0.004    # estable hasta ~0.008; baja con tensión fuerte
substeps         = 6        # subpasos por frame

# --- Mundo ---
gravity          = 9.81
restitution      = 0.2      # rebote del borde; 0.2 = tipo agua (no goma)
domainMinX       = 0
domainMinY       = 0
domainMaxX       = 800
domainMaxY       = 600

# --- Render ---
pointSize        = 15
